name: RefontCrafts
version: '1.0.9'
main: ru.refontstudio.refontcrafts.RefontCrafts
awareness:
  - !@UTF8
softdepend:
  - AdvancedEnchantments
commands:
  rcrafts:
    aliases: [rc, refontcraft, refontcrafts]
    description: RefontCrafts commands
    permission: refontcrafts.use
  crafts:
    description: View all custom recipes and current availability
permissions:
  refontcrafts.use:
    default: true
  refontcrafts.crafts:
    default: true
  refontcrafts.view:
    default: true
  refontcrafts.create.workbench:
    default: op
  refontcrafts.create.anvil:
    default: op
  refontcrafts.edit.workbench:
    default: op
  refontcrafts.edit.anvil:
    default: op
  refontcrafts.delete.workbench:
    default: op
  refontcrafts.delete.anvil:
    default: op
  refontcrafts.recipe:
    default: op
  refontcrafts.anvil:
    default: op
  refontcrafts.browse:
    default: true
  refontcrafts.reload:
    default: op
  refontcrafts.admin:
    default: op
    children:
      refontcrafts.use: true
      refontcrafts.crafts: true
      refontcrafts.view: true
      refontcrafts.create.workbench: true
      refontcrafts.create.anvil: true
      refontcrafts.edit.workbench: true
      refontcrafts.edit.anvil: true
      refontcrafts.delete.workbench: true
      refontcrafts.delete.anvil: true
      refontcrafts.recipe: true
      refontcrafts.anvil: true
      refontcrafts.browse: true
      refontcrafts.reload: true

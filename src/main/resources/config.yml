# ========== RefontCrafts ==========
# Author: https://t.me/orythix
# This is the plugin config. Here you can adjust the appearance,
# the database, and recipe behavior (workbench/anvil).

settings:
  prefix: "§x§2§5§A§F§F§1R§x§2§2§A§8§F§2e§x§1§E§A§1§F§4f§x§1§B§9§B§F§5o§x§1§8§9§4§F§6n§x§1§4§8§D§F§7t§x§1§1§8§6§F§9C§x§0§D§7§F§F§Ar§x§0§A§7§8§F§Ba§x§0§7§7§2§F§Cf§x§0§3§6§B§F§Et§x§0§0§6§4§F§Fs &8»&7 "
  # Interface language: en, ru, vi, zh_cn
  language: "en"

  titles:
    # GUI title for workbench recipes
    recipe: "§bWorkbench Recipes"
    # GUI title for anvil recipes
    anvil: "§dAnvil Recipes"
    # Browser title for workbench recipes (view menu)
    browser_workbench: "§bWorkbench Recipes"
    # Browser title for anvil recipes (view menu)
    browser_anvil: "§dAnvil Recipes"

  # Exact item matching:
  # true  - compare isSimilar (name, lore, enchants, NBT, etc.)
  # false - compare stable metadata but ignore unique technical NBT.
  exact_meta_match: false

  # Workbenches: strict 3x3 layout (the recipe works only with exact placement).
  workbench_strict_shape: true

  # Limit of the visible craft preview/result stack. 126 keeps the client display working.
  workbench_preview_limit: 126

  # Allow horizontal mirror of the pattern. Default: no.
  # If enabled, ABC will also match as CBA on the same row.
  workbench_allow_mirror: false

  # Return items to player when closing the GUI without saving
  take_back_on_close: true

  # Default cost for new anvil recipes (in levels)
  default_anvil_cost: 0

  # Anvil mode:
  # auto  - if AdvancedEnchantments is installed, use click-book mode; otherwise normal anvil
  # anvil - always use the anvil
  # click - always use inventory clicking
  anvil_mode: auto

  database:
    # Database backend: sqlite is local .db file; mysql is external MySQL/MariaDB server.
    # Recipes and items are stored with metadata and can be moved between servers.
    type: sqlite

    sqlite:
      # Database file name in the plugin folder
      file: data.db

    mysql:
      # MySQL host (host:port is allowed)
      host: 127.0.0.1
      # MySQL port
      port: 3306
      # Database name
      database: refontcrafts
      # Database user and password
      user: root
      password: ''
      # Use SSL
      use_ssl: false
      # Additional connection parameters (optional)
      params: "useUnicode=true&characterEncoding=utf8"

    # Save new recipes asynchronously (less lag).
    async_save: true

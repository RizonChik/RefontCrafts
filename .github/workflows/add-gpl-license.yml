name: Add GPL-3.0 license

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-gpl-license.yml'

permissions:
  contents: write

jobs:
  add-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Add official GPL-3.0 license
        shell: bash
        run: |
          curl --fail --show-error --location \
            --connect-timeout 15 --max-time 60 --retry 3 \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt \
            --output LICENSE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE

          if ! git diff --cached --quiet; then
            git commit -m "Add GPL-3.0 license"
            git push
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/add-gpl-license.yml
          git commit -m "Remove temporary license workflow"
          git push
